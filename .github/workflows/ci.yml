name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/bootstrap, infra/envs/dev]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive infra
      - name: Init (no backend, no AWS access)
        run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: ${{ matrix.root }}
      - run: terraform validate
        working-directory: ${{ matrix.root }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build training image (not pushed)
        run: docker build -f docker/Dockerfile --build-arg GIT_SHA="${GITHUB_SHA}" -t training:ci .
